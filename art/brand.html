<!doctype html>
<!-- The README banner, the logo and the social preview, drawn with the site's own materials
     (web/img, web/fonts). scripts/bake_brand.py screenshots each #id into .github/assets/. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goose Package Index brand art</title>
<style>
@font-face { font-family: "Nunito"; font-weight: 400 900; src: url(../web/fonts/nunito.woff2) format("woff2"); }
@font-face { font-family: "Caveat"; font-weight: 500 700; src: url(../web/fonts/caveat.woff2) format("woff2"); }
:root {
  --ink: #2B2B2B; --ink-2: #5B564C; --paper: #F3EDE0; --orange: #F28C28; --leaf-dk: #3F6642;
  --lawn: url(../web/img/grass-a.png) 0 0 / 257px, url(../web/img/grass-b.png) 113px 61px / 409px, url(../web/img/grass-c.webp) 0 0 / 683px, #9DC283;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 40px; background: #555; font-family: "Nunito", sans-serif; color: var(--ink); display: grid; gap: 40px; justify-items: start; }
.lawn { position: relative; overflow: hidden; isolation: isolate; background: var(--lawn); }
.lawn::after { /* a soft vignette, so the edges sit quietly next to GitHub's page */
  content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none;
  background: radial-gradient(120% 140% at 50% 45%, rgba(0,0,0,0) 55%, rgba(30, 55, 20, .22)); }

/* the beam the planks are nailed to, as in the site header */
.beam { position: absolute; left: -20px; right: -20px; height: 30px; z-index: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,0) 40%, rgba(0,0,0,.22)), url(../web/img/wood-dark.webp) 0 0 / 360px 160px;
  filter: url(#wobble) drop-shadow(0 6px 5px rgba(30, 45, 15, .3)); }

.plank { position: relative; isolation: isolate; z-index: 1; }
.plank::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 12px 8px 13px 9px;
  background: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,0) 35%, rgba(110, 70, 30, .14)), url(../web/img/wood-light.webp) 0 0 / 360px 160px;
  box-shadow: inset 0 0 0 2px rgba(120, 80, 40, .5), inset 0 -6px 0 rgba(120, 80, 40, .2), inset 0 3px 0 rgba(255,255,255,.35);
  filter: url(#wobble) drop-shadow(0 5px 0 #A97C4A) drop-shadow(0 12px 12px rgba(46, 70, 24, .32));
}
.plank::after {
  content: ""; position: absolute; inset: 10px 12px; z-index: -1;
  --nail: radial-gradient(circle, #5E4126 0 2.4px, #C9A472 2.6px 3.4px, rgba(0,0,0,0) 3.8px);
  background: var(--nail) 0 0 / 10px 10px no-repeat, var(--nail) 100% 0 / 10px 10px no-repeat, var(--nail) 0 100% / 10px 10px no-repeat, var(--nail) 100% 100% / 10px 10px no-repeat;
}
.dark::before { background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(0,0,0,0) 30%, rgba(0,0,0,.14)), url(../web/img/wood-mid.webp) 0 0 / 360px 160px;
  box-shadow: inset 0 0 0 2px rgba(60, 35, 12, .55), inset 0 3px 0 rgba(255,255,255,.18);
  filter: url(#wobble) drop-shadow(0 5px 0 #5A3D22) drop-shadow(0 12px 12px rgba(46, 70, 24, .32)); }
.dark::after { --nail: radial-gradient(circle, #3E2A17 0 2.4px, #9C7A52 2.6px 3.4px, rgba(0,0,0,0) 3.8px); }

.tile { display: grid; place-items: center; }
.tile svg { color: var(--orange); transform: rotate(-12deg); filter: drop-shadow(0 3px 0 #B9651A) drop-shadow(0 6px 6px rgba(80, 45, 10, .25)); }
.title { font-weight: 900; letter-spacing: -.015em; line-height: 1; white-space: nowrap; }
.title b { color: var(--leaf-dk); font-weight: 900; }

.strip { position: relative; isolation: isolate; display: inline-block; font-weight: 750; white-space: nowrap; }
.strip::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 3px;
  background: linear-gradient(170deg, rgba(255,255,255,.35), rgba(255,255,255,0) 45%, rgba(150, 120, 70, .08)), url(../web/img/paper.webp) 0 0 / 260px, var(--paper);
  filter: url(#torn) drop-shadow(0 6px 8px rgba(46, 70, 24, .28)); }
.hand { font-family: "Caveat", cursive; font-weight: 700; }

.signs { display: flex; gap: 22px; }
.signs .plank { font-weight: 850; padding: 9px 22px 10px; display: flex; align-items: center; gap: 10px; }
.signs .plank::after { inset: 7px 8px; }
.signs svg { width: 22px; height: 22px; }
.signs > :nth-child(odd) { transform: rotate(-1.2deg); } .signs > :nth-child(even) { transform: rotate(1deg); }

/* ---- the README banner: 1280 x 400 */
#banner { width: 1280px; height: 400px; }
#banner .beam { top: 104px; }
#banner .row { position: absolute; left: 0; right: 0; top: 46px; display: flex; justify-content: center; align-items: center; gap: 26px; }
#banner .tile { width: 132px; height: 132px; transform: rotate(-2deg); }
#banner .tile svg { width: 84px; height: 84px; }
#banner .title { font-size: 70px; padding: 30px 46px 34px; transform: rotate(.6deg); }
#banner .tag { position: absolute; left: 0; right: 0; top: 214px; text-align: center; z-index: 2; }
#banner .tag .strip { font-size: 29px; padding: 6px 18px 9px; transform: rotate(-.8deg); }
#banner .signs { position: absolute; left: 0; right: 0; top: 300px; justify-content: center; font-size: 21px; z-index: 2; }

/* ---- the logo: 512 x 512, transparent */
#logo { width: 512px; height: 512px; display: grid; place-items: center; background: transparent; }
#logo .tile { width: 400px; height: 400px; transform: rotate(-3deg); }
#logo .tile::before { border-radius: 40px 30px 44px 32px; box-shadow: inset 0 0 0 4px rgba(120, 80, 40, .5), inset 0 -14px 0 rgba(120, 80, 40, .2), inset 0 6px 0 rgba(255,255,255,.35);
  filter: url(#wobble-lg) drop-shadow(0 12px 0 #A97C4A) drop-shadow(0 18px 14px rgba(46, 70, 24, .3)); }
#logo .tile::after { inset: 30px; --nail: radial-gradient(circle, #5E4126 0 6px, #C9A472 6.5px 8.5px, rgba(0,0,0,0) 9.5px);
  background: var(--nail) 0 0 / 24px 24px no-repeat, var(--nail) 100% 0 / 24px 24px no-repeat, var(--nail) 0 100% / 24px 24px no-repeat, var(--nail) 100% 100% / 24px 24px no-repeat; }
#logo .tile svg { width: 250px; height: 250px; filter: drop-shadow(0 8px 0 #B9651A) drop-shadow(0 14px 12px rgba(80, 45, 10, .25)); }

/* ---- the social preview: 1280 x 640 (GitHub: Settings > Social preview) */
#social { width: 1280px; height: 640px; }
#social .beam { top: 230px; height: 34px; }
#social .row { position: absolute; left: 0; right: 0; top: 160px; display: flex; justify-content: center; align-items: center; gap: 30px; }
#social .tile { width: 170px; height: 170px; transform: rotate(-2deg); }
#social .tile svg { width: 108px; height: 108px; }
#social .title { font-size: 84px; padding: 38px 54px 42px; transform: rotate(.6deg); }
#social .tag { position: absolute; left: 0; right: 0; top: 370px; text-align: center; z-index: 2; }
#social .tag .strip { font-size: 36px; padding: 8px 22px 11px; transform: rotate(-.8deg); }
#social .signs { position: absolute; left: 0; right: 0; top: 470px; justify-content: center; font-size: 25px; z-index: 2; }
#social .url { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; font-size: 34px; color: #2F4F2F; z-index: 2; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
<filter id="torn" x="-4%" y="-8%" width="108%" height="116%"><feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="4" seed="7"/><feDisplacementMap in="SourceGraphic" scale="9"/></filter>
<filter id="wobble" x="-4%" y="-6%" width="108%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.011 0.03" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter>
<filter id="wobble-lg" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.006 0.012" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="14"/></filter>
<symbol id="foot" viewBox="0 0 32 32"><path d="M16 30L9.6 20.5L3.4 10.4Q2.6 6.6 6.4 7.6L12.2 13.2L13.4 4.2Q16 .8 18.6 4.2L19.8 13.2L25.6 7.6Q29.4 6.6 28.6 10.4L22.4 20.5Z" fill="currentColor" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.8l4.8 4.7L19.5 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4L11.8 5.8M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4l1.4-1.4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
</svg>

<section id="banner" class="lawn">
  <div class="beam"></div>
  <div class="row">
    <div class="plank tile"><svg viewBox="0 0 32 32"><use href="#foot"/></svg></div>
    <div class="plank title">Goose Package Index</div>
  </div>
  <div class="tag"><span class="strip">Every library, tool and program for the Goose language.</span></div>
  <div class="signs">
    <div class="plank dark"><svg><use href="#i-search"/></svg>Searchable</div>
    <div class="plank dark"><svg><use href="#i-check"/></svg>Build-tested on 3 OSes</div>
    <div class="plank dark"><svg><use href="#i-link"/></svg>Links only</div>
  </div>
</section>

<section id="logo">
  <div class="plank tile"><svg viewBox="0 0 32 32"><use href="#foot"/></svg></div>
</section>

<section id="social" class="lawn">
  <div class="beam"></div>
  <div class="row">
    <div class="plank tile"><svg viewBox="0 0 32 32"><use href="#foot"/></svg></div>
    <div class="plank title">Goose Package Index</div>
  </div>
  <div class="tag"><span class="strip">Every library, tool and program for the Goose language.</span></div>
  <div class="signs">
    <div class="plank dark"><svg><use href="#i-search"/></svg>Searchable</div>
    <div class="plank dark"><svg><use href="#i-check"/></svg>Build-tested on 3 OSes</div>
    <div class="plank dark"><svg><use href="#i-link"/></svg>Links only</div>
  </div>
  <div class="url hand">safdafang.github.io/goose-index</div>
</section>
</body>
</html>
