name: Remove my project
description: You are the author and want your project taken off the index
title: "Remove: "
labels: [wontfix]
body:
  - type: markdown
    attributes:
      value: |
        It will be removed, no questions asked. Open this from the account that owns the repository,
        or link to a note in the repository itself, so we know the request comes from the author.
  - type: input
    id: repo
    attributes:
      label: Repository URL
      placeholder: https://github.com/owner/name
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Anything else (optional)
