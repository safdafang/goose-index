# Build-test entries against the latest Goose release on Linux, macOS and Windows.
# Weekly for everything (results go to data/compat.json, then `update` republishes);
# on pull requests for the entries they add or change (results in the run summary only).
# See scripts/compat.py for what "builds" means.
name: compat

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "Entry ids to test, comma-separated (empty: all)"
        required: false
        default: ""
  pull_request:
    paths: ["packages/**"]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      only: ${{ steps.plan.outputs.only }}
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            ONLY=$(git diff --name-only --diff-filter=AM "origin/$BASE...HEAD" -- 'packages/*.toml' \
                   | sed 's#^packages/##; s#\.toml$##' | grep -E '^[a-z0-9-]+$' | paste -sd, -)
            if [ -z "$ONLY" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [0, 1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the latest Goose release
        run: python scripts/compat.py install "$RUNNER_TEMP/goose" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install the system libraries the entries ask for
        run: |
          libs=$(python scripts/compat.py libs)
          [ -n "$libs" ] || exit 0
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update -q
              for p in $libs; do sudo apt-get install -y -q "$p" || echo "::warning::apt could not install $p"; done ;;
            macOS)
              for p in $libs; do brew install -q "$p" || echo "::warning::brew could not install $p"; done ;;
          esac
      - name: Build-test
        env:
          ONLY: ${{ needs.plan.outputs.only }}
          SHARD: ${{ matrix.shard }}
        run: python scripts/compat.py run --shard "$SHARD/3" --only "$ONLY" --out "compat-$RUNNER_OS-$SHARD.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-${{ runner.os }}-${{ matrix.shard }}
          path: compat-*.json
          if-no-files-found: ignore

  merge:
    needs: [plan, test]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: compat-*
          merge-multiple: true
          path: results
      - name: Merge the results
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/compat.py merge results/*.json --run-url "$RUN_URL"
      - name: Commit data/compat.json
        if: github.event_name != 'pull_request'
        run: |
          git add data/compat.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Record build-test results"
          git pull --rebase origin main
          git push origin HEAD:main
